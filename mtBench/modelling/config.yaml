# uv run hibayes-process --config config.yaml --data ../data/all.jsonl --out output/process/
data_process:
  path: custom_processor.py
  processors:
    - extract_observed_feature: {feature_name: left_chosen}
    - add_squared_column:  
        feature: length_diff_prop
    - extract_features: 
        categorical_features: ['left_model', 'right_model', 'grader', 'question_id']
        continuous_features: [length_diff_prop, length_diff_prop_squared, position_numeric] 
        effect_coding_for_main_effects: true
        standardise: true  
        interactions: true
    - add_pairwise_model_dims:
        model_feature: left_model
        group_features: [question_id]

# uv run hibayes-model --config config.yaml --analysis-state output/process/ --out output/model/
model:
  path: custom_model.py
  models:
    # ========== TEST NECESSITY OF HIERARCHICAL STRUCTURE ==========
    
    - name: pwl
      config:
        tag: _question
        hierarchical_effects: 
          - [question_id, 'left_model']  # Only question
        hierarchical_continuous: []
    
    - name: pwl
      config:
        tag: _grader
        hierarchical_effects: 
          - [grader, 'left_model']  # Only grader
        hierarchical_continuous: []
    
    # ========== BASELINE: Both biases (linear) ==========
    - name: pwl
      config:
        tag: _grader_question_position_length
        hierarchical_effects: 
          - [question_id, 'left_model']
          - [grader, 'left_model'] 
          - [grader, position_numeric]
          - [grader, length_diff_prop]             
        hierarchical_continuous: [position_numeric, length_diff_prop]
    
    # ========== COMPLEXITY: Test non-linearity and interactions ==========
    - name: pwl
      config:
        tag: _grader_question_position_squaredlength
        hierarchical_effects: 
          - [question_id, 'left_model']
          - [grader, 'left_model'] 
          - [grader, position_numeric]
          - [grader, length_diff_prop]
          - [grader, length_diff_prop_squared] 
        hierarchical_continuous: [position_numeric, length_diff_prop, length_diff_prop_squared]
    
    - name: pwl
      config:
        tag: _grader_question_position_length_3W
        hierarchical_effects: 
          - [question_id, 'left_model']
          - [grader, 'left_model'] 
          - [grader, position_numeric]
          - [grader, length_diff_prop]
          - [grader, 'left_model', position_numeric]  
        hierarchical_continuous: [position_numeric, length_diff_prop]
        prior_hierarchical_mean_scale: 1.0 
        prior_hierarchical_sigma_scale: 0.5
  
check:
  checkers:
    - prior_predictive_plot: {interactive: false}
    - divergences
    - r_hat
    - ess_bulk
    - ess_tail
    - posterior_predictive_plot: {interactive: false}
    - waic

# uv run hibayes-comm --config config.yaml --analysis-state output/model/ --out output/communicate/
communicate:
  path: custom_communicator.py
  communicators:
    # Combined plot
    - model_comparison_with_forest:
        ic: waic
        figsize: [16, 6]
        width_ratios: [1, 2]  
        vertical_line: 0
        best_model: true
        rank_by_baseline: true
        hdi_prob: 0.95
        show_mode: "absolute"
        variable_labels:
          gpt4_absolute_quality: "GPT-4 ranking"
          human_absolute_quality: "Human ranking"
          position_bias_per_grader: "Position bias"
          length_bias_per_grader: "Length bias"
        forest_title: "Posterior Parameter Estimates with 95% HDI"
